services:
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundo
      POSTGRES_PASSWORD: fundo
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - ./sql/seed:/docker-entrypoint-initdb.d:ro
      - source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundo -d ops"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  source_pgdata:
